kind: Pod
apiVersion: v1
metadata:
  name: configpod
spec:
  containers:
  - name: confpod 
    image: nginx
    env:
    - name: personname
      valueFrom:
        configMapKeyRef:
          name: configmapra          # The ConfigMap this value comes from.
          key: username
    - name: pass 
      valueFrom:
        configMapKeyRef:
          name: configmapra          # The ConfigMap this value comes from.
          key: password