kind: Pod
apiVersion: v1
metadata:
  name: resourceslimit
spec:
  containers:
  - name: resorceski
    image: nginx
    resources:
    # Idhi soft requests
      requests: 
        memory: "64Mi"
        cpu: "250m"
      limits: # Idhi hard limit
        memory: "128Mi"
        cpu: "500m"


# appudu kooda hard limit anedhi soft limit ki equal ga ayina vundali or above ayina vundali
# ledhu ante container anedhi work avadhu